<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { Water } from 'three/addons/objects/Water.js';
import { mergeVertices, mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ================= 随机与噪声 ================= */
let _seed = 20260912;
function rnd(){ _seed |= 0; _seed = _seed + 0x6D2B79F5 | 0; let t = Math.imul(_seed ^ _seed >>> 15, 1 | _seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }
const rr = (a,b)=>a+(b-a)*rnd();
function hash2(x,y){ const s=Math.sin(x*127.1+y*311.7)*43758.5453; return s-Math.floor(s); }
function vnoise2(x,y){ const ix=Math.floor(x),iy=Math.floor(y); let u=x-ix,v=y-iy;
  u=u*u*(3-2*u); v=v*v*(3-2*v);
  return hash2(ix,iy)*(1-u)*(1-v)+hash2(ix+1,iy)*u*(1-v)+hash2(ix,iy+1)*(1-u)*v+hash2(ix+1,iy+1)*u*v; }
function fbm2(x,y,o=4){ let s=0,a=.5,f=1; for(let i=0;i<o;i++){ s+=a*vnoise2(x*f,y*f); a*=.5; f*=2; } return s; }
function hash3(x,y,z){ const s=Math.sin(x*127.1+y*311.7+z*74.7)*43758.5453; return s-Math.floor(s); }
function vnoise3(x,y,z){ const ix=Math.floor(x),iy=Math.floor(y),iz=Math.floor(z);
  let u=x-ix,v=y-iy,w=z-iz; u=u*u*(3-2*u); v=v*v*(3-2*v); w=w*w*(3-2*w);
  const l=(a,b,t)=>a+(b-a)*t;
  return l( l( l(hash3(ix,iy,iz),hash3(ix+1,iy,iz),u), l(hash3(ix,iy+1,iz),hash3(ix+1,iy+1,iz),u), v),
            l( l(hash3(ix,iy,iz+1),hash3(ix+1,iy,iz+1),u), l(hash3(ix,iy+1,iz+1),hash3(ix+1,iy+1,iz+1),u), v), w); }
function fbm3(x,y,z,o=4){ let s=0,a=.5,f=1; for(let i=0;i<o;i++){ s+=a*vnoise3(x*f,y*f,z*f); a*=.5; f*=2; } return s; }

/* ================= 画布贴图工厂 ================= */
function ctex(w,h,draw,{srgb=true}={}){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const g=c.getContext('2d'); draw(g,w,h);
  const t=new THREE.CanvasTexture(c);
  if(srgb) t.colorSpace=THREE.SRGBColorSpace;
  t.wrapS=t.wrapT=THREE.RepeatWrapping; t.anisotropy=4;
  return t;
}
/* 草地 */
const grassTex=ctex(256,256,(g,w,h)=>{
  g.fillStyle='#94a173'; g.fillRect(0,0,w,h);
  for(let i=0;i<2600;i++){ const x=rnd()*w,y=rnd()*h, r=rr(1,4);
    const t=fbm2(x/38,y/38); g.fillStyle=t>0.55?`rgba(122,140,96,${rr(.25,.55)})`:`rgba(108,124,86,${rr(.2,.5)})`;
    g.beginPath(); g.arc(x,y,r,0,7); g.fill(); }
  for(let i=0;i<500;i++){ g.strokeStyle=`rgba(140,155,108,${rr(.12,.3)})`; g.lineWidth=1;
    const x=rnd()*w,y=rnd()*h; g.beginPath(); g.moveTo(x,y); g.lineTo(x+rr(-2,2),y-rr(3,7)); g.stroke(); }
});
grassTex.repeat.set(1/4.2,1/4.2);
/* 石板 */
const stoneTex=ctex(128,128,(g,w,h)=>{
  g.fillStyle='#a9aaa3'; g.fillRect(0,0,w,h);
  for(let i=0;i<900;i++){ g.fillStyle=`rgba(${rnd()>.5?90:200},${rnd()>.5?92:202},${rnd()>.5?86:196},${rr(.05,.14)})`;
    g.fillRect(rnd()*w,rnd()*h,rr(1,4),rr(1,4)); }
  g.strokeStyle='rgba(70,72,66,.25)'; g.lineWidth=1.2;
  for(let i=0;i<3;i++){ g.beginPath(); g.moveTo(rnd()*w,rnd()*h); g.lineTo(rnd()*w,rnd()*h); g.stroke(); }
});
/* 粉墙 */
const plasterTex=ctex(128,128,(g,w,h)=>{
  g.fillStyle='#f4f1e8'; g.fillRect(0,0,w,h);
  for(let i=0;i<1400;i++){ g.fillStyle=`rgba(${rnd()>.5?190:255},${rnd()>.5?188:252},${rnd()>.5?176:240},${rr(.04,.1)})`;
    g.fillRect(rnd()*w,rnd()*h,rr(1,3),rr(1,3)); }
});
/* 屋面瓦（灰瓦筒瓦，2列×4垄） */
const tileTex=ctex(256,256,(g,w,h)=>{
  const cols=2, rows=4, cw=w/cols, ch=h/rows;
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    const x=c*cw,y=r*ch, t=rr(-8,8);
    const gr=g.createLinearGradient(0,y,0,y+ch);
    gr.addColorStop(0,`rgb(${222+t},${226+t},${230+t})`); gr.addColorStop(.75,`rgb(${190+t},${194+t},${199+t})`);
    gr.addColorStop(1,`rgb(${168+t},${172+t},${178+t})`);
    g.fillStyle=gr; g.fillRect(x,y,cw,ch);
    g.strokeStyle='rgba(96,100,106,.85)'; g.lineWidth=2.5;
    g.beginPath(); g.ellipse(x+cw/2,y+ch-9,cw*.30,ch*.16,0,0,Math.PI); g.stroke();
    g.fillStyle='rgba(96,100,106,.4)'; g.fillRect(x,y+cw? y+ch-7:x,0,0);
    g.fillStyle='rgba(70,74,80,.35)'; g.fillRect(x,y+ch-5,cw,5);
    g.fillStyle='rgba(90,94,100,.5)'; g.fillRect(x+cw-2,y,2,ch);
  }
  g.fillStyle='rgba(78,82,88,.5)';
  for(let r=1;r<=rows;r++) g.fillRect(0,r*ch-4,w,4);
});
/* 水面法线（周期噪声） */
const waterNrmTex=(()=> {
  const N=256, hh=new Float32Array(N*N), P=8;
  const pn=(x,y,f)=>{ const per=P*f; const ix=Math.floor(x),iy=Math.floor(y);
    let u=x-ix,v=y-iy; u=u*u*(3-2*u); v=v*v*(3-2*v);
    const H=(a,b)=>hash2(((a%per)+per)%per+f*57, ((b%per)+per)%per+f*131);
    return H(ix,iy)*(1-u)*(1-v)+H(ix+1,iy)*u*(1-v)+H(ix,iy+1)*(1-u)*v+H(ix+1,iy+1)*u*v; };
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const u=x/N*P, v=y/N*P; let s=0,a=.5;
    for(const f of [1,2,4]){ s+=a*pn(u*f,v*f,f); a*=.5; } hh[y*N+x]=s; }
  const c=document.createElement('canvas'); c.width=c.height=N; const g=c.getContext('2d');
  const img=g.createImageData(N,N);
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const l=hh[y*N+((x-1+N)%N)], r=hh[y*N+((x+1)%N)], u=hh[((y-1+N)%N)*N+x], d=hh[((y+1)%N)*N+x];
    let nx=(l-r)*2.2, ny=(u-d)*2.2, nz=1; const len=Math.sqrt(nx*nx+ny*ny+nz*nz);
    const i=(y*N+x)*4;
    img.data[i]=(nx/len*.5+.5)*255; img.data[i+1]=(ny/len*.5+.5)*255; img.data[i+2]=(nz/len*.5+.5)*255; img.data[i+3]=255; }
  g.putImageData(img,0,0);
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.colorSpace=THREE.NoColorSpace;
  return t;
})();
/* 叶片 alpha 贴图 */
const leafTexWide=ctex(64,32,(g)=>{ g.clearRect(0,0,64,32); g.fillStyle='#fff';
  g.beginPath(); g.moveTo(2,16); g.quadraticCurveTo(30,1,62,16); g.quadraticCurveTo(30,31,2,16); g.fill(); },{srgb:false});
const leafTexSlim=ctex(64,16,(g)=>{ g.clearRect(0,0,64,16); g.fillStyle='#fff';
  g.beginPath(); g.moveTo(1,8); g.quadraticCurveTo(26,0,63,7); g.quadraticCurveTo(26,15,1,8); g.fill(); },{srgb:false});
/* 匾额 */
function plaqueTex(text,bg='#1b2436',fg='#e2c076'){
  return ctex(512,160,(g,w,h)=>{
    g.fillStyle=bg; g.fillRect(0,0,w,h);
    g.strokeStyle=fg; g.globalAlpha=.9; g.lineWidth=4; g.strokeRect(10,10,w-20,h-20);
    g.lineWidth=1.5; g.strokeRect(18,18,w-36,h-36); g.globalAlpha=1;
    g.fillStyle=fg; g.textAlign='center'; g.textBaseline='middle';
    g.font=`bold ${h*0.5}px "Kaiti SC","STKaiti","KaiTi","SimSun",serif`;
    g.fillText(text,w/2,h/2+h*0.04);
  });
}

/* ================= 材质 ================= */
const M={
  roof:  new THREE.MeshStandardMaterial({color:0x69737f, map:tileTex, roughness:.85, side:THREE.DoubleSide}),
  ridge: new THREE.MeshStandardMaterial({color:0x454b54, roughness:.7}),
  woodR: new THREE.MeshStandardMaterial({color:0x8c3d2a, roughness:.72}),   // 朱红柱
  wood:  new THREE.MeshStandardMaterial({color:0x7d5636, roughness:.78}),   // 木色柱
  woodD: new THREE.MeshStandardMaterial({color:0x4c3826, roughness:.8}),    // 深木（枋/门）
  white: new THREE.MeshStandardMaterial({color:0xf4f1e8, map:plasterTex, roughness:.95}),
  coping:new THREE.MeshStandardMaterial({color:0x565b60, roughness:.9}),    // 墙帽
  stone: new THREE.MeshStandardMaterial({color:0xa4a6a0, map:stoneTex, roughness:.95}), // 石作
  stoneD:new THREE.MeshStandardMaterial({color:0x83867f, map:stoneTex, roughness:.95}),
  plat:  new THREE.MeshStandardMaterial({color:0x9b9d96, map:stoneTex, roughness:.95}), // 台基
  floorW:new THREE.MeshStandardMaterial({color:0x7a5a3c, roughness:.85}),   // 木地板
  rock:  new THREE.MeshStandardMaterial({color:0xffffff, vertexColors:true, roughness:.98}), // 太湖石
  leafW: new THREE.MeshStandardMaterial({map:leafTexWide, alphaTest:.45, side:THREE.DoubleSide, roughness:.9, color:0xffffff}),
  leafS: new THREE.MeshStandardMaterial({map:leafTexSlim, alphaTest:.45, side:THREE.DoubleSide, roughness:.9, color:0xffffff}),
  trunk: new THREE.MeshStandardMaterial({color:0x5c4632, roughness:.92}),
  pine:  new THREE.MeshStandardMaterial({color:0xffffff, vertexColors:true, roughness:1}),
  ban:   new THREE.MeshStandardMaterial({color:0x4e7c40, roughness:.85, side:THREE.DoubleSide}),
  lotus: new THREE.MeshStandardMaterial({color:0xffffff, roughness:.7, side:THREE.DoubleSide}),
  petal: new THREE.MeshStandardMaterial({color:0xe7bcd0, roughness:.65, side:THREE.DoubleSide}),
  dark:  new THREE.MeshStandardMaterial({color:0x30363f, roughness:.6}),
  bronze:new THREE.MeshStandardMaterial({color:0x2e3440, roughness:.5, metalness:.5}),
  mud:   new THREE.MeshStandardMaterial({color:0x24363a, roughness:1}),
};

/* ================= 渲染器 / 场景 ================= */
const app=document.getElementById('app');
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.06;
app.appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0xe3ece6,65,205);

const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,900);
camera.position.set(46,30,64);

const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,1.2,-2);
controls.enableDamping=true; controls.dampingFactor=.06;
controls.maxPolarAngle=1.53; controls.minDistance=3; controls.maxDistance=120;
controls.addEventListener('start',()=>camTween=null);

/* 灯光 */
const sun=new THREE.DirectionalLight(0xfff1dc,2.6);
sun.position.set(26,38,14); sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-46,right:46,top:44,bottom:-44,near:4,far:130});
sun.shadow.bias=-0.0004; sun.shadow.normalBias=0.04;
scene.add(sun);
scene.add(new THREE.HemisphereLight(0xd8e9f2,0x8f9a80,.55));
const fill=new THREE.DirectionalLight(0xcfe0ea,.35); fill.position.set(-22,18,-24); scene.add(fill);

/* 天空穹顶 */
scene.add(new THREE.Mesh(new THREE.SphereGeometry(380,24,14),
  new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,fog:false,
    vertexShader:`varying vec3 vP; void main(){ vP=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
    fragmentShader:`varying vec3 vP;
      void main(){ float hgt=normalize(vP).y;
        vec3 zen=vec3(.47,.66,.85), hor=vec3(.93,.95,.92), low=vec3(.87,.91,.88);
        vec3 c = hgt>0. ? mix(hor,zen,pow(hgt,.55)) : mix(hor,low,clamp(-hgt*4.,0.,1.));
        gl_FragColor=vec4(c,1.); }`})));

const garden=new THREE.Group(); scene.add(garden);
const dummy=new THREE.Object3D(), tmpC=new THREE.Color();

/* ================= 工具：形体 / 合并盒体 ================= */
function boxesMerged(list,mat){ // list: {x,y,z,w,h,d,ry?}
  const gs=list.map(b=>{ const g=new THREE.BoxGeometry(b.w,b.h,b.d);
    g.rotateY(b.ry||0); g.translate(b.x,b.y,b.z); return g; });
  return new THREE.Mesh(mergeGeometries(gs),mat);
}
function shapeFromXZ(pts){ return new THREE.Shape(pts.map(p=>new THREE.Vector2(p[0],-p[1]))); }

/* ============ 屋顶：带正脊的歇山/庑殿式曲面顶 ============ */
function hipRoofGeo(w,d,ridge,h,upturn,E=14,S=9){
  const hw=w/2,hd=d/2,rx=ridge/2;
  const pos=[],uv=[],idx=[]; let vi=0;
  const eaveY=u=>{ const a=Math.abs(2*u-1); return upturn*Math.pow(Math.max(0,a-0.12)/0.88,2.4); };
  function face(edgeFn,topFn,uRep,vRep){
    for(let i=0;i<=E;i++){ const u=i/E, e=edgeFn(u), t=topFn(u);
      for(let j=0;j<=S;j++){ const v=j/S;
        pos.push(e[0]+(t[0]-e[0])*v, e[1]+(t[1]-e[1])*Math.pow(v,1.45), e[2]+(t[2]-e[2])*v);
        uv.push(u*uRep, v*vRep); } }
    for(let i=0;i<E;i++)for(let j=0;j<S;j++){
      const a=vi+i*(S+1)+j,b=a+S+1;
      idx.push(a,b,a+1,a+1,b,b+1); }
    vi+=(E+1)*(S+1);
  }
  const clampR=x=>Math.max(-rx,Math.min(rx,x));
  face(u=>[-hw+u*w, eaveY(u),  hd], u=>[clampR(-hw+u*w), h, 0], w/0.56, Math.hypot(h,hd)/1.36);
  face(u=>[-hw+u*w, eaveY(u), -hd], u=>[clampR(-hw+u*w), h, 0], w/0.56, Math.hypot(h,hd)/1.36);
  face(u=>[-hw, eaveY(u), -hd+u*d], u=>[-rx, h, 0], d/0.56, Math.hypot(h,hw-rx)/1.36);
  face(u=>[ hw, eaveY(u), -hd+u*d], u=>[ rx, h, 0], d/0.56, Math.hypot(h,hw-rx)/1.36);
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
  g.setIndex(idx); g.computeVertexNormals(); return g;
}
/* 攒尖顶：N 边形底面收于宝顶 */
function tentRoofGeo(pts2,apexH,upturn,E=10,S=8){
  const n=pts2.length, cx=0,cz=0;
  const pos=[],uv=[],idx=[]; let vi=0;
  for(let f=0;f<n;f++){
    const A=pts2[f],B=pts2[(f+1)%n];
    const eLen=Math.hypot(B[0]-A[0],B[1]-A[1]);
    for(let i=0;i<=E;i++){ const u=i/E;
      const ex=A[0]+(B[0]-A[0])*u, ez=A[1]+(B[1]-A[1])*u, ey=upturn*Math.pow(2*u-1,2);
      for(let j=0;j<=S;j++){ const v=j/S, pv=Math.pow(v,1.45);
        pos.push(ex+(cx-ex)*v, ey+(apexH-ey)*pv, ez+(cz-ez)*v);
        uv.push(u*eLen/0.56, v*Math.hypot(apexH,eLen/2)/1.36); } }
    for(let i=0;i<E;i++)for(let j=0;j<S;j++){
      const a=vi+i*(S+1)+j,b=a+S+1;
      idx.push(a,b,a+1,a+1,b,b+1); }
    vi+=(E+1)*(S+1);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
  g.setIndex(idx); g.computeVertexNormals(); return g;
}
/* 脊饰：正脊/鸱吻/垂脊/角兽/宝顶 */
function roofDeco(group,{w,d,ridge,h,upturn}){
  const hw=w/2,hd=d/2,rx=ridge/2;
  const eaveY=u=>{ const a=Math.abs(2*u-1); return upturn*Math.pow(Math.max(0,a-0.12)/0.88,2.4); };
  const corners=[[hw,hd],[-hw,hd],[hw,-hd],[-hw,-hd]];
  const tops= ridge>0 ? [[rx,0],[-rx,0],[rx,0],[-rx,0]] : [[0,0],[0,0],[0,0],[0,0]];
  const tubes=[];
  corners.forEach((c,i)=>{
    const p0=new THREE.Vector3(c[0]*0.99,eaveY(c[0]===hw?1:0)+0.02,c[1]*0.99);
    const p2=new THREE.Vector3(tops[i][0],h,tops[i][1]);
    const p1=p0.clone().lerp(p2,.5).add(new THREE.Vector3(0,.16,0));
    tubes.push(new THREE.TubeGeometry(new THREE.QuadraticBezierCurve3(p0,p1,p2),8,.062,6));
  });
  group.add(new THREE.Mesh(mergeGeometries(tubes),M.dark));
  if(ridge>0){

  const p=g.attributes.position, vv=new THREE.Vector3(), pits=[];
  for(let i=0;i<5;i++) pits.push(new THREE.Vector3(rr(-1,1),rr(-1,1),rr(-1,1)).normalize().multiplyScalar(rr(.15,.55)));
  const disp=new Float32Array(p.count);

      if(dist<.85) d-=Math.pow(1-dist/.85,2)*.85; }
    disp[i]=d;
    vv.multiplyScalar(1+d*.42/Math.max(r0,.001));
    p.setXYZ(i,vv.x,vv.y,vv.z);

    const dir=[dx/L,dz/L], perp=[dir[1],-dir[0]], phi=Math.atan2(-dir[1],dir[0]);

function makeWall({from,to,h=2.7,t=.34,circles=[],rects=[],windows=[]}){
  const A=new THREE.Vector2(...from),B=new THREE.Vector2(...to);
  const L=A.distanceTo(B), dir=B.clone().sub(A).normalize();
  const shape=new THREE.Shape();
  shape.moveTo(0,0); shape.lineTo(L,0); shape.lineTo(L,h); shape.lineTo(0,h); shape.closePath();
  for(const c of circles){ const p=new THREE.Path();

function pathPointFn(pts){ const seg=[]; let tot=0;
  for(let i=0;i<pts.length-1;i++){ const L=Math.hypot(pts[i+1][0]-pts[i][0],pts[i+1][1]-pts[i][1]);
    seg.push({a:pts[i],b:pts[i+1],L,s0:tot}); tot+=L; }
  return s=>{ s=Math.max(0,Math.min(tot-.001,s));
    for(const sg of seg){ if(s<=sg.s0+sg.L){ const t=(s-sg.s0)/sg.L;
      return {x:sg.a[0]+(sg.b[0]-sg.a[0])*t, z:sg.a[1]+(sg.b[1]-sg.a[1])*t,
        dx:(sg.b[0]-sg.a[0])/sg.L, dz:(sg.b[1]-sg.a[1])/sg.L}; } } };
}

  const leafGeoA=new THREE.PlaneGeometry(1.7,.55,10,1);
  { const p=leafGeoA.attributes.position;
    for(let i=0;i<p.count;i++){ const x=p.getX(i); p.setZ(i,.32*Math.pow(x/.85,2)); } leafGeoA.computeVertexNormals(); }
  const leafGeoB=leafGeoA.clone();
  const listA=[],listB=[];
  plants.forEach(([x,z,s],pi)=>{
    const stem=new THREE.Mesh(new THREE.CylinderGeometry(.1,.14,.75*s,7),new THREE.MeshStandardMaterial({color:0x5d7a3c,roughness:.9}));
    stem.position.set(x,.35*s,z); stem.castShadow=true; garden.add(stem);
    for(let k=0;k<7;k++){ const a=k/7*Math.PI*2+pi;
      (k%2?listA:listB).push({x,z,y:.72*s,a:Math.atan2(Math.cos(a),Math.sin(a)),tilt:rr(-1.05,-.55),s}); }
  });
  const mk=(list,geo)=>{ const im=new THREE.InstancedMesh(geo,M.ban,list.length);
    list.forEach((l,i)=>{ dummy.position.set(l.x,l.y,l.z);
      dummy.rotation.set(0,l.a,0); dummy.rotateX(l.tilt);
      dummy.scale.setScalar(l.s); dummy.updateMatrix(); im.setMatrixAt(i,dummy.matrix); });
    im.castShadow=true; garden.add(im); };
  mk(listA,leafGeoA); mk(listB,leafGeoB);
}

/* ================= 荷花 ================= */
{
  const padShape=new THREE.Shape();
  padShape.moveTo(0,0); padShape.absarc(0,0,1,.32,Math.PI*2-.32,false); padShape.closePath();
  const padGeo=new THREE.ShapeGeometry(padShape,20); padGeo.rotateX(-Math.PI/2);
  const clusters=[[3.5,4.5,42],[-10.5,-4,30]];
  const pads=[];
  clusters.forEach(([cx,cz,n])=>{ for(let i=0;i<n;i++){
    const a=rr(0,6.28), r=Math.sqrt(rnd())*3.1;
    pads.push([cx+Math.cos(a)*r, cz+Math.sin(a)*r]); } });
  const im=new THREE.InstancedMesh(padGeo,M.lotus,pads.length);
  pads.forEach((p,i)=>{ dummy.position.set(p[0],-.2,p[1]);
    dummy.rotation.set(rr(-.08,.08),rr(0,6.28),rr(-.08,.08));
    dummy.scale.setScalar(rr(.22,.42)); dummy.updateMatrix(); im.setMatrixAt(i,dummy.matrix);
    tmpC.setHSL(.32,.4,rr(.26,.4)); im.setColorAt(i,tmpC); });
  im.castShadow=true; garden.add(im);
  // 花（合并单朵）
  const petalShape=new THREE.Shape();
  petalShape.moveTo(0,0); petalShape.quadraticCurveTo(.09,.13,0,.27); petalShape.quadraticCurveTo(-.09,.13,0,0);
  const petalGeo=new THREE.ShapeGeometry(petalShape,8);
  function flowerGeo(){
    const parts=[];
    for(let i=0;i<8;i++){ const g=petalGeo.clone();
      g.rotateX(.62); g.rotateY(i/8*Math.PI*2); parts.push(g); }
    for(let i=0;i<6;i++){ const g=petalGeo.clone(); g.scale(.72,.72,.72);
      g.rotateX(.32); g.rotateY(i/6*Math.PI*2+.4); g.translate(0,.03,0); parts.push(g); }
    const c=new THREE.CylinderGeometry(.05,.06,.04,8); c.translate(0,.09,0); parts.push(c);
    return mergeGeometries(parts);
  }
  const fGeo=flowerGeo();
  const spots=[[4.6,3.2],[2.4,5.6],[4.0,5.9],[2.9,3.3],[5.6,4.6],[3.6,2.4],[-9.6,-4.8],[-11.4,-3.2],[-10.2,-5.2]];
  const fim=new THREE.InstancedMesh(fGeo,M.petal,spots.length);
  spots.forEach((p,i)=>{ dummy.position.set(p[0],-.12,p[1]);
    dummy.rotation.set(rr(-.12,.12),rr(0,6.28),rr(-.12,.12)); dummy.scale.setScalar(rr(.9,1.3));
    dummy.updateMatrix(); fim.setMatrixAt(i,dummy.matrix); });
  fim.castShadow=true; garden.add(fim);
}
/* 太湖石缸（小水景） */
[[-8.4,-9.4],[8.4,-9.4]].forEach(([x,z])=>{
  const g=new THREE.Group();
  const body=new THREE.Mesh(new THREE.CylinderGeometry(.52,.42,.62,12),new THREE.MeshStandardMaterial({color:0x4a4a46,roughness:.9}));
  body.position.y=.31; g.add(body);
  const w=new THREE.Mesh(new THREE.CircleGeometry(.47,12),M.mud); w.rotation.x=-Math.PI/2; w.position.y=.5; g.add(w);
  for(let k=0;k<3;k++){ const p=new THREE.Mesh(padGeo2(),M.lotus);
    p.position.set(rr(-.2,.2),.53,rr(-.2,.2)); p.scale.setScalar(.14); p.rotation.z=rr(0,3); g.add(p); }
  g.position.set(x,0,z); g.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}});
  garden.add(g);
});
function padGeo2(){ if(padGeo2.g) return padGeo2.g;
  const s=new THREE.Shape(); s.moveTo(0,0); s.absarc(0,0,1,.32,Math.PI*2-.32,false); s.closePath();
  const g=new THREE.ShapeGeometry(s,16); g.rotateX(-Math.PI/2); padGeo2.g=g; return g; }

/* ================= 借景：郊野地坪、远山与塔影 ================= */
{
  // 园外大地（避免园林如浮岛）
  const apron=new THREE.Mesh(new THREE.CircleGeometry(360,48),
    new THREE.MeshStandardMaterial({color:0xa3b18d,roughness:1}));
  apron.rotation.x=-Math.PI/2; apron.position.y=-0.07; garden.add(apron);
  // 远山（没入地平线，雾中淡影）
  const hillMat=new THREE.MeshStandardMaterial({color:0xaebfae,roughness:1});
  [[-55,-135,80,11,34],[25,-150,95,14,40],[85,-120,60,8,28],[-120,-125,70,9,30]].forEach(([x,z,rx,ry,rz])=>{
    const h=new THREE.Mesh(new THREE.SphereGeometry(1,20,12),hillMat);
    h.position.set(x,-6,z); h.scale.set(rx,ry,rz); garden.add(h);
  });
  const G=new THREE.Group(); G.position.set(-14,0,-92);
  let y=0, w=3.6;
  const base=new THREE.Mesh(new THREE.BoxGeometry(w*1.7,1.2,w*1.7),new THREE.MeshStandardMaterial({color:0x8b97a0,roughness:.9}));
  base.position.y=.6; G.add(base); y=1.2;
  for(let i=0;i<7;i++){
    const bh=1.7*Math.pow(.93,i), bw=w*Math.pow(.9,i);
    const body=new THREE.Mesh(new THREE.BoxGeometry(bw,bh,bw),new THREE.MeshStandardMaterial({color:0x93a0a8,roughness:.9}));
    body.position.y=y+bh/2; G.add(body);
    const roof=makeRoof({w:bw*1.75,d:bw*1.75,ridge:bw*.35,h:.55,upturn:.3});
    roof.position.y=y+bh; G.add(roof);
    y+=bh+.55;
  }
  const s1=new THREE.Mesh(new THREE.SphereGeometry(.3,10,8),M.bronze); s1.position.y=y+.1; G.add(s1);
  const s2=new THREE.Mesh(new THREE.ConeGeometry(.12,.9,8),M.bronze); s2.position.y=y+.7; G.add(s2);
  G.traverse(o=>{ if(o.isMesh){o.castShadow=false;o.receiveShadow=false;} });
  garden.add(G);
}

/* ================= 阴影与首帧 ================= */
garden.traverse(o=>{ if(o.isMesh||o.isInstancedMesh){ o.castShadow=o.castShadow??true; o.receiveShadow=true; } });
water.receiveShadow=false;

/* ================= 相机漫游 ================= */
const VIEWS=[
  {p:[23,18.5,40], t:[0,.8,-2]},
  {p:[0,1.75,18.4], t:[0,2.3,-13]},
  {p:[0,2.7,-8.8],  t:[7.4,2.2,4.9]},
  {p:[-18.6,1.8,-12.5], t:[-22,1.3,-4]},
];
let camTween=null;
function flyTo(v,dur=1.8){ camTween={t:0,dur,p0:camera.position.clone(),p1:new THREE.Vector3(...v.p),
  t0:controls.target.clone(),t1:new THREE.Vector3(...v.t)}; }
document.querySelectorAll('#views button').forEach(b=>{
  b.addEventListener('click',()=>flyTo(VIEWS[+b.dataset.v])); });
flyTo(VIEWS[0],2.6);

/* ================= 循环 ================= */
const clock=new THREE.Clock();
let frames=0;
function ease(t){ return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2; }
function animate(){
  requestAnimationFrame(animate);
  const rawDt=clock.getDelta();
  const dt=Math.min(rawDt,.05), t=clock.elapsedTime;
  water.material.uniforms.time.value+=dt*.55;
  if(camTween){ camTween.t+=Math.min(rawDt,.25)/camTween.dur; const k=ease(Math.min(camTween.t,1));
    camera.position.lerpVectors(camTween.p0,camTween.p1,k);
    controls.target.lerpVectors(camTween.t0,camTween.t1,k);
    if(camTween.t>=1) camTween=null; }
  controls.target.x=THREE.MathUtils.clamp(controls.target.x,-28,28);
  controls.target.z=THREE.MathUtils.clamp(controls.target.z,-20,20);
  controls.target.y=THREE.MathUtils.clamp(controls.target.y,.4,14);
  controls.update();
  if(++frames===4) renderer.shadowMap.autoUpdate=false; // 场景静态，阴影烘焙一次
  renderer.render(scene,camera);
  if(frames===2) document.getElementById('loader').classList.add('done');
}
animate();
setTimeout(()=>document.getElementById('loader').classList.add('done'),1600); // 兜底：页签节流时也能进入

addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });

/* 暴露调试句柄：控制台可用 __GARDEN__.flyTo(VIEWS[n]) 切换视角 */
window.__GARDEN__={camera,controls,flyTo,VIEWS,renderer,scene};
